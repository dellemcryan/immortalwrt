name: Build ImmortalWrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/dellemcryan/immortalwrt
  REPO_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          if [ -e .config ]; then
            echo "Using custom config"
            make defconfig
          else
            echo "No config found"
            make defconfig
          fi

      - name: Download packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -delete

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: |
            bin/targets/**
